<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-toolbar color="primary">Menú</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">Dashboard</a>
      <a mat-list-item routerLink="/pacientes">Pacientes</a>
      <a mat-list-item routerLink="/zonas">Zonas</a>
      <a mat-list-item routerLink="/estadisticas">Estadísticas</a>
      <a mat-list-item routerLink="/informes">Informes</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Gestión Hospitalaria</span>
    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
