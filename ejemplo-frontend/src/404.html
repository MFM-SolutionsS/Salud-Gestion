<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname.replace('/Salud-Gestion', '');
      sessionStorage.setItem('redirectPath', path + window.location.search + window.location.hash);
      window.location.replace('/Salud-Gestion/');
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
